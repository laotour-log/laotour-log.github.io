<style>
  [hidden] { display: none !important; }

  /* 背景は看板画像(1002.jpg)の黒に合わせ、OSの明暗設定にかかわらず固定 */
  :root {
    --bg: #000000;
    --text: #e8e8e8;
    --sub-text: #b8b8b8;
    --btn-bg: #1c1c1c;
    --btn-text: #ffffff;
    --btn-border: #444444;
    --btn-bg-hover: #2a2a2a;
    --focus: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 1rem;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
  }

  .page {
    width: 100%;
    max-width: 28rem;
  }

  .banner {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 0.75rem;
  }

  .avatar {
    display: block;
    width: 9rem;
    height: 9rem;
    margin: 1.5rem auto 2rem;
  }

  .link-grid {
    list-style: none;
    display: grid;
    gap: 0.75rem;
  }
  .link-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  .link-btn {
    display: flex;
    align-items: center;
    min-height: 3.5rem;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    border-radius: 0.75rem;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
  }
  .link-btn--stack {
    flex-direction: column;
    justify-content: center;
    gap: 0.25rem;
    padding: 0.75rem 0.25rem;
    text-align: center;
  }
  .link-btn:hover { background: var(--btn-bg-hover); }
  .link-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .link-icon {
    width: 1.5rem;
    height: 1.5rem;
    flex-shrink: 0;
    fill: currentColor;
  }
  .link-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem;
    height: 1.5rem;
    flex-shrink: 0;
    border: 2px solid currentColor;
    border-radius: 50%;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
  }
  .link-name { min-width: 0; overflow-wrap: anywhere; }
</style>
</head>
