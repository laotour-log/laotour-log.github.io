<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>laotour-log</title>
<style>
  :root {
    --bg: #000000;
    --text: #b8b8b8;
    --accent: var(--bg);
    --accent-text: #ffffff;
    --accent-border: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 1.5rem;
    text-align: center;
  }

  .banner {
    display: block;
    width: 100%;
    max-width: 40rem;
    height: auto;
  }

  a.enter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 1.3rem 3.5rem;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent-text);
    background: var(--accent);
    border: 2px solid var(--accent-border);
    border-radius: 999px;
    text-decoration: none;
    letter-spacing: 0.05em;
  }

  a.enter:active {
    filter: brightness(0.92);
  }

  a.enter .ter-orange {
    color: #ff9d28;
  }
</style>
</head>
<body>
  <img class="banner" src="sk_links/1080.jpg" width="1279" height="577" alt="いらっしゃいませ　イカ野郎">
  <a class="enter" href="/the_day_before_yesterday/">en<span class="ter-orange">ter</span></a>
</body>
</html>
