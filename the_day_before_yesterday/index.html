<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>laotour-log</title>
<style>
  :root {
    --bg: #000000;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .images {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    max-width: 32rem;
    width: 100%;
  }

  .images img {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="images">
    <img src="100.jpg" alt="おとといきて下さい">
    <img src="101.jpg" alt="">
  </div>
</body>
</html>
